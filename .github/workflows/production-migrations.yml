name: Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRODUCTION_MIGRATIONS to continue
        required: true
        type: string

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Dry run and apply migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate production confirmation and configuration
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "APPLY_PRODUCTION_MIGRATIONS"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - uses: supabase/setup-cli@v3
        with:
          version: 2.107.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration state before apply
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Capture remote public schema for drift analysis
        run: supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --schema public --file remote-public-schema.sql

      - name: Upload remote schema snapshot
        uses: actions/upload-artifact@v6
        with:
          name: remote-public-schema-${{ github.run_id }}
          path: remote-public-schema.sql
          if-no-files-found: error
          retention-days: 7

      - name: Prepare evidence-only migration view
        run: |
          mkdir -p /tmp/deferred-local-migrations
          for file in supabase/migrations/[0-9][0-9][0-9]_*.sql; do
            version="$(basename "$file")"
            version="${version%%_*}"
            number=$((10#$version))
            if (( number >= 23 && number <= 67 )); then
              mv "$file" /tmp/deferred-local-migrations/
            fi
          done
          while IFS= read -r version; do
            [[ -z "$version" || "$version" == \#* ]] && continue
            printf '%s\n' '-- Legacy production migration; SQL unavailable in this repository.' \
              > "supabase/migrations/${version}_legacy_remote_history.sql"
          done < supabase/legacy-remote-migrations.txt

      - name: Dry run pending migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes

      - name: Verify evidence schema and private bucket
        run: |
          query=$(cat <<'SQL'
          select
            to_regclass('public.source_fetches') is not null as source_fetches,
            to_regclass('public.authority_record_revisions') is not null as authority_record_revisions,
            to_regclass('public.ingestion_runs') is not null as ingestion_runs,
            to_regclass('public.shadow_comparisons') is not null as shadow_comparisons,
            to_regclass('public.document_extraction_attempts') is not null as document_extraction_attempts,
            to_regclass('public.fsn_detail') is not null as fsn_detail,
            to_regclass('public.run_reviewer_assignments') is not null as run_reviewer_assignments,
            to_regclass('public.review_requirements') is not null as review_requirements,
            to_regclass('public.human_adjudication_events') is not null as human_adjudication_events,
            to_regclass('public.exclusion_review_samples') is not null as exclusion_review_samples,
            to_regprocedure('public.claim_ingestion_run(uuid,text,text,date,date)') is not null as claim_ingestion_run,
            to_regprocedure('public.is_search_run_adjudication_complete(uuid)') is not null as adjudication_gate,
            exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'fsn_results'
                and column_name = 'authority_revision_id'
            ) as fsn_results_revision_link,
            exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'filter_decisions'
                and column_name = 'evidence_parser_version'
            ) as filter_decisions_parser_version,
            exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'product_profiles'
                and column_name = 'is_synthetic_canary'
            ) as product_profiles_canary_scope,
            exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'search_runs'
                and column_name = 'canary_execution_id'
            ) as search_runs_canary_scope,
            exists (
              select 1 from storage.buckets
              where id = 'regulatory-evidence' and public = false
            ) as evidence_bucket_private;
          SQL
          )
          jq -n --arg query "$query" '{query: $query, read_only: true}' \
            | curl --fail --silent --show-error \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            | jq -e '
                (if type == "array" then .[0] elif .result then .result[0] else . end) as $r
                | ($r.source_fetches == true)
                  and ($r.authority_record_revisions == true)
                  and ($r.ingestion_runs == true)
                  and ($r.shadow_comparisons == true)
                  and ($r.document_extraction_attempts == true)
                  and ($r.fsn_detail == true)
                  and ($r.run_reviewer_assignments == true)
                  and ($r.review_requirements == true)
                  and ($r.human_adjudication_events == true)
                  and ($r.exclusion_review_samples == true)
                  and ($r.claim_ingestion_run == true)
                  and ($r.adjudication_gate == true)
                  and ($r.fsn_results_revision_link == true)
                  and ($r.filter_decisions_parser_version == true)
                  and ($r.product_profiles_canary_scope == true)
                  and ($r.search_runs_canary_scope == true)
                  and ($r.evidence_bucket_private == true)
              '

      - name: Show migration state after apply
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
