name: Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRODUCTION_MIGRATIONS to continue
        required: true
        type: string

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Dry run and apply migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production confirmation and configuration
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "APPLY_PRODUCTION_MIGRATIONS"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration state before apply
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Capture remote public schema for drift analysis
        run: supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --schema public --file remote-public-schema.sql

      - name: Upload remote schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: remote-public-schema-${{ github.run_id }}
          path: remote-public-schema.sql
          if-no-files-found: error
          retention-days: 7

      - name: Dry run pending migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Show migration state after apply
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
