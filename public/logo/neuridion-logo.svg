<svg xmlns="http://www.w3.org/2000/svg" width="340" height="60" viewBox="0 0 340 60" fill="none">

  <!-- ============================================ -->
  <!-- SHIELD MARK (left, scaled to ~50x60)         -->
  <!-- ============================================ -->

  <!-- Shield outline -->
  <path
    d="M25 3 L47 12.5 L47 27.5 Q47 40 25 47.5 Q3 40 3 27.5 L3 12.5 Z"
    stroke="#0F1F3D"
    stroke-width="1.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Neural connections: hub to primary nodes -->
  <line x1="25" y1="25" x2="17" y2="16" stroke="#0D9488" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="25" y1="25" x2="33" y2="16" stroke="#0D9488" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>
  <line x1="25" y1="25" x2="25" y2="37" stroke="#0D9488" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>

  <!-- Leaf connections (from top primaries) -->
  <line x1="17" y1="16" x2="12" y2="11" stroke="#0F1F3D" stroke-width="0.3" stroke-linecap="round" opacity="0.5"/>
  <line x1="17" y1="16" x2="15" y2="21" stroke="#0F1F3D" stroke-width="0.3" stroke-linecap="round" opacity="0.5"/>
  <line x1="33" y1="16" x2="38" y2="11" stroke="#0F1F3D" stroke-width="0.3" stroke-linecap="round" opacity="0.5"/>
  <line x1="33" y1="16" x2="35" y2="21" stroke="#0F1F3D" stroke-width="0.3" stroke-linecap="round" opacity="0.5"/>

  <!-- Leaf nodes (small, navy) -->
  <circle cx="12" cy="11" r="0.9" fill="#0F1F3D"/>
  <circle cx="15" cy="21" r="0.9" fill="#0F1F3D"/>
  <circle cx="38" cy="11" r="0.9" fill="#0F1F3D"/>
  <circle cx="35" cy="21" r="0.9" fill="#0F1F3D"/>

  <!-- Primary nodes (medium, teal) -->
  <circle cx="17" cy="16" r="1.5" fill="#0D9488"/>
  <circle cx="33" cy="16" r="1.5" fill="#0D9488"/>
  <circle cx="25" cy="37" r="1.5" fill="#0D9488"/>

  <!-- Central hub (teal ring with white center) -->
  <circle cx="25" cy="25" r="2.2" fill="#0D9488"/>
  <circle cx="25" cy="25" r="0.9" fill="white"/>

  <!-- ============================================ -->
  <!-- WORDMARK: "Neuridion"                        -->
  <!--                                              -->
  <!-- Full word rendered, then teal circle overlaid -->
  <!-- on the first "i" dot as brand accent          -->
  <!-- ============================================ -->

  <text
    x="65"
    y="40"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="600"
    font-size="36"
    fill="#0F1F3D"
    letter-spacing="-0.5"
  >Neuridion</text>

  <!--
    Teal dot replacing the first "i" tittle (in "ri").
    At font-size 36 semibold with system-ui:
    - N ~22px, e ~18px, u ~19px, r ~12px = ~71px for "Neur"
    - The "i" stem center is ~4px into the glyph
    - letter-spacing -0.5 * 4 chars = -2px adjustment
    - i tittle center x: 65 + 71 - 2 + 4 = ~138
    - tittle y: baseline(40) - ascent, typically ~17-18 for 36px font
  -->
  <circle cx="138" cy="17.5" r="3" fill="#0D9488"/>

  <!-- ============================================ -->
  <!-- NEURAL ACCENT after final "n"                -->
  <!-- Short horizontal teal line + terminal node,  -->
  <!-- like a neural connection trailing off         -->
  <!--                                              -->
  <!-- Full word width ~188px, ending at ~65+188=253 -->
  <!-- ============================================ -->

  <line x1="256" y1="34" x2="280" y2="34" stroke="#0D9488" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="283" cy="34" r="2.5" fill="#0D9488"/>

</svg>
