<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Shield outline (white for dark backgrounds) -->
  <path
    d="M100 12 L178 50 L178 110 Q178 158 100 190 Q22 158 22 110 L22 50 Z"
    stroke="white"
    stroke-width="6"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Neural network connections -->
  <line x1="100" y1="100" x2="65" y2="62" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="100" x2="135" y2="62" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="100" x2="60" y2="120" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="100" x2="140" y2="120" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="100" x2="100" y2="150" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Secondary connections -->
  <line x1="65" y1="62" x2="135" y2="62" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="65" y1="62" x2="60" y2="120" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="135" y1="62" x2="140" y2="120" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="60" y1="120" x2="100" y2="150" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="140" y1="120" x2="100" y2="150" stroke="#5EEAD4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Tertiary leaf connections -->
  <line x1="65" y1="62" x2="48" y2="44" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="65" y1="62" x2="50" y2="78" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="135" y1="62" x2="152" y2="44" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="135" y1="62" x2="150" y2="78" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="120" x2="42" y2="108" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="140" y1="120" x2="158" y2="108" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Leaf nodes -->
  <circle cx="48" cy="44" r="3.5" fill="white"/>
  <circle cx="50" cy="78" r="3.5" fill="white"/>
  <circle cx="152" cy="44" r="3.5" fill="white"/>
  <circle cx="150" cy="78" r="3.5" fill="white"/>
  <circle cx="42" cy="108" r="3.5" fill="white"/>
  <circle cx="158" cy="108" r="3.5" fill="white"/>

  <!-- Primary nodes -->
  <circle cx="65" cy="62" r="6" fill="#5EEAD4"/>
  <circle cx="135" cy="62" r="6" fill="#5EEAD4"/>
  <circle cx="60" cy="120" r="6" fill="#5EEAD4"/>
  <circle cx="140" cy="120" r="6" fill="#5EEAD4"/>
  <circle cx="100" cy="150" r="6" fill="#5EEAD4"/>

  <!-- Central hub node -->
  <circle cx="100" cy="100" r="9" fill="#5EEAD4"/>
  <circle cx="100" cy="100" r="4" fill="#0F1F3D"/>
</svg>
