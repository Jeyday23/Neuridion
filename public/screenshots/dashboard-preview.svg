<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <!-- Browser window frame -->
  <rect width="1200" height="700" rx="8" ry="8" fill="#F1F5F9" />

  <!-- Top bar -->
  <rect width="1200" height="35" rx="8" ry="0" fill="#F1F5F9" />
  <rect y="27" width="1200" height="8" fill="#F1F5F9" />

  <!-- Window dots -->
  <circle cx="20" cy="17" r="6" fill="#E2E8F0" />
  <circle cx="40" cy="17" r="6" fill="#E2E8F0" />
  <circle cx="60" cy="17" r="6" fill="#E2E8F0" />

  <!-- Address bar text -->
  <text x="600" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">neuridion.eu/dashboard</text>

  <!-- Main area gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
  </defs>
  <rect y="35" width="1200" height="665" fill="url(#bg)" />

  <!-- Magnifying glass icon -->
  <circle cx="600" cy="290" r="30" fill="none" stroke="#0D9488" stroke-width="4" />
  <line x1="622" y1="312" x2="642" y2="332" stroke="#0D9488" stroke-width="4" stroke-linecap="round" />

  <!-- Title text -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#0F1F3D">Dashboard Preview</text>

  <!-- Subtitle text -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#0D9488">Product screenshot coming soon</text>
</svg>
