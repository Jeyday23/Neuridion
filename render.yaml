services:
  - type: web
    name: neuridion-web
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVarGroups:
      - neuridion-env

  - type: worker
    name: neuridion-search-worker
    env: node
    buildCommand: npm install
    startCommand: npx tsx worker/search-runner.ts
    envVarGroups:
      - neuridion-env
